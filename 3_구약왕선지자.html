<!DOCTYPE html>
<html lang="ko">
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta charset="UTF-8">
<title>구약성경 왕·선지자 연대 타임라인</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;700;900&family=Noto+Sans+KR:wght@300;400;500;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#16100a;
  --parch:#fdf6e3;
  --parch2:#f4e8c1;
  --gold:#c8960c;
  --gold2:#f0b429;
  --ink:#1a0f00;

  /* 시대색 */
  --c-pre:#3d5a9a;      /* 족장/출애굽/사사 */
  --c-unified:#1e3a6e;  /* 통일왕국 */
  --c-north:#0e6b6b;    /* 북이스라엘 */
  --c-south:#8b1a1a;    /* 남유다 */
  --c-exile:#3a3a60;    /* 포로기 */
  --c-return:#1a5c2a;   /* 귀환 */

  /* 선지자색 */
  --p-early:#4a6aaa;
  --p-north:#0a7a7a;
  --p-south:#7a1080;
  --p-exile:#3a2a80;
  --p-return:#1a6a30;

  /* 1년 = 몇 px */
  --px-per-yr: 2.2px;
}

*{margin:0;padding:0;box-sizing:border-box;}

body{
  font-family:'Noto Sans KR',sans-serif;
  background:var(--bg);
  color:var(--ink);
  min-height:100vh;
  overflow:auto;
  display:flex;
  flex-direction:column;
}

/* ══ 상단 60%: 연대기 스크롤 영역 ══ */
#tl-wrap{
  height:55vh;
  overflow-x:auto;
  overflow-y:hidden;
  flex-shrink:0;
  background:var(--parch);
  border-bottom:3px solid var(--gold);
}
#tl-wrap::-webkit-scrollbar{ height:6px; }
#tl-wrap::-webkit-scrollbar-track{ background:#2a1a08; }
#tl-wrap::-webkit-scrollbar-thumb{ background:var(--gold); border-radius:3px; }

.page{
  width: 7800px;
  height:100%;          /* tl-wrap 높이에 맞춤 */
  background:var(--parch);
  padding:0;            /* 패딩 제거 - 빈 공백 없애기 */
  position:relative;
  display:flex;
  flex-direction:column;
}

/* ══ 하단 40%: 인물정보 + 지도 ══ */
#bottom-panel{
  height:40vh;
  flex-shrink:0;
  background:#12122a;
  display:flex;
  flex-direction:column;
  overflow:hidden;
}

/* 탭 버튼 */
#tab-bar{
  display:flex;
  align-items:stretch;
  height:52px;
  background:#0d0d1a;
  border-bottom:2px solid var(--gold);
  flex-shrink:0;
}
.tab-btn{
  padding:0 24px;
  font-size:22.5px;
  font-weight:700;
  color:#6060a0;
  background:transparent;
  border:none;
  cursor:pointer;
  border-bottom:3px solid transparent;
  transition:all .15s;
  letter-spacing:1px;
  font-family:'Noto Sans KR',sans-serif;
}
.tab-btn.active{
  color:#ffe080;
  border-bottom-color:var(--gold);
  background:#1a1a3a;
}
.tab-btn:hover:not(.active){ color:#aac0ff; }

#selected-name{
  padding:0 16px;
  display:flex;
  align-items:center;
  font-size:27px;
  font-weight:900;
  color:#ffe080;
  font-family:'Noto Serif KR',serif;
  border-right:2px solid #2a2a5a;
  min-width:200px;
}

/* 탭 콘텐츠 */
#tab-content{
  flex:1;
  overflow:hidden;
  position:relative;
}

/* 인물 탭 */
#tab-person{
  display:flex;
  height:100%;
}
#info-left{
  width:240px;
  min-width:220px;
  background:#0d0d22;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  padding:12px;
  border-right:2px solid #3a3a6a;
  gap:6px;
  flex-shrink:0;
}
#info-name{
  font-family:'Noto Serif KR',serif;
  font-size:42px;
  font-weight:900;
  color:#ffe080;
  text-align:center;
  line-height:1.2;
}
#info-period{
  font-size:21px;
  color:#aac0ff;
  font-weight:700;
  text-align:center;
}
#info-type-badge{
  font-size:13px;
  padding:3px 12px;
  border-radius:20px;
  font-weight:700;
  color:#fff;
  background:#3a3a70;
  text-align:center;
}
#info-right{
  flex:1;
  padding:12px 18px;
  overflow-y:auto;
  display:flex;
  flex-direction:column;
  gap:7px;
}
#info-deeds{
  font-size:34px;
  line-height:1.85;
  color:#e0e8ff;
}
#info-verses{
  font-size:29px;
  color:#80d0a0;
  line-height:1.7;
  border-top:1px solid #2a2a5a;
  padding-top:6px;
}

/* 지도 탭 */
#tab-map{
  display:none;
  height:100%;
  position:relative;
}
#map-container{
  width:100%;
  height:100%;
  background:#1a2a1a;
  display:flex;
  align-items:center;
  justify-content:center;
  flex-direction:column;
  gap:10px;
}
#map-title{
  position:absolute;
  top:10px;left:16px;
  font-size:22.5px;
  font-weight:700;
  color:#ffe080;
  font-family:'Noto Serif KR',serif;
  z-index:5;
}
#map-svg-wrap{
  width:100%;
  height:100%;
  position:relative;
}
#map-svg-wrap svg{
  width:100%;
  height:100%;
}

/* 빈 상태 */
#bottom-empty{
  display:flex;
  align-items:center;
  justify-content:center;
  height:100%;
  font-size:24px;
  color:#4a4a8a;
  font-weight:700;
  letter-spacing:1px;
}

/* ══ 클릭된 인물 하이라이트 ══ */
.king-seg.selected{ outline:3px solid #ffe080 !important; filter:brightness(1.3); z-index:9; }
.prophet-card.selected{ box-shadow:0 0 0 3px #ffe080 !important; filter:brightness(1.2); z-index:9; }

/* ══ 제목 ══ */
h1{
  text-align:center;
  font-family:'Noto Serif KR',serif;
  font-size:39px;
  font-weight:900;
  color:var(--c-unified);
  letter-spacing:5px;
  border-bottom:2.5px solid var(--gold);
  padding-bottom:10px;
  margin-bottom:12px;
}

/* ══ 공통: 행 래퍼 ══ */
.row-wrap{
  display:flex;
  align-items:stretch;
  /* margin 제거 - 빈 공백 없애기 */
}
.row-wrap.fill-row{
  flex:1;
  min-height:0;
}

.row-label{
  width:72px;
  min-width:72px;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:15px;
  font-weight:700;
  writing-mode:vertical-rl;
  letter-spacing:2px;
  color:#fff;
  border-radius:3px 0 0 3px;
  flex-shrink:0;
}

.row-body{
  flex:1;
  position:relative;
  display:flex;
  align-items:stretch;
}

/* ══ 연도 눈금 배경 (세로줄) ══ */
.tick-bg{
  position:absolute;
  top:0;bottom:0;
  width:1px;
  background:rgba(0,0,0,0.08);
  pointer-events:none;
  z-index:0;
}
.tick-bg.major{
  background:rgba(0,0,0,0.18);
  width:1.5px;
}

/* ══ 연도 눈금 행 ══ */
.yearbar{
  height:42px;
  background:var(--parch2);
  border-top:2px solid var(--gold);
  border-bottom:2px solid var(--gold);
  position:relative;
  margin-bottom:4px;
}
.ytick{
  position:absolute;
  top:0;bottom:0;
  display:flex;
  align-items:center;
  padding-left:3px;
  font-size:21px;
  font-weight:700;
  font-family:'Noto Serif KR',serif;
  color:#1a2e6a;
  border-left:1.5px solid #c8a040;
  white-space:nowrap;
}

/* ══ 시대 헤더 배너 ══ */
.era-bar{
  height:28px;
  position:relative;
  margin-bottom:3px;
}
.era-seg{
  position:absolute;
  top:0;bottom:0;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:15px;
  font-weight:700;
  color:#fff;
  border-right:1px solid rgba(255,255,255,0.3);
  overflow:hidden;
  white-space:nowrap;
  letter-spacing:0.5px;
}

/* ══ 왕/지도자 칸 ══ */
.king-seg{
  position:absolute;
  top:0;bottom:0;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  border-right:1px solid rgba(255,255,255,0.35);
  overflow:hidden;
  cursor:pointer;
  transition:filter 0.15s;
}
.king-seg:hover{ filter:brightness(1.15); }
.king-seg .kname{
  font-size:19px;
  font-weight:700;
  color:#fff;
  text-shadow:0 1px 2px rgba(0,0,0,0.5);
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
  max-width:96%;
  text-align:center;
  line-height:1.3;
}
.king-seg .kyear{
  font-size:14.4px;
  color:rgba(255,255,255,0.75);
  white-space:nowrap;
  margin-top:1px;
}

/* 선한/악한 구분 표시 */
.king-seg.good{ outline:2px solid rgba(120,255,120,0.45); }
.king-seg.evil{ outline:2px solid rgba(255,80,80,0.30); }

/* ══ 분열 마커 ══ */
.split-line{
  position:absolute;
  top:0;bottom:0;
  width:3px;
  background:#ff4020;
  z-index:20;
  box-shadow:0 0 8px #ff4020;
}
.split-label{
  position:absolute;
  top:2px;
  background:#ff4020;
  color:#fff;
  font-size:12.8px;
  font-weight:700;
  padding:1px 4px;
  border-radius:2px;
  white-space:nowrap;
  z-index:21;
}

/* ══ 화살표 타임라인 행 ══ */
.arrow-row{
  height:32px;
  position:relative;
  display:flex;
  align-items:center;
  margin-bottom:4px;
}
.arrow-seg{
  position:absolute;
  top:3px;bottom:3px;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:15px;
  font-weight:700;
  color:#fff;
  border-radius:2px;
  overflow:hidden;
  white-space:nowrap;
}
.arrow-seg::after{
  content:'';
  position:absolute;
  right:-12px;top:50%;
  transform:translateY(-50%);
  border-top:13px solid transparent;
  border-bottom:13px solid transparent;
  border-left:12px solid currentColor;
  z-index:5;
}
/* 마지막 화살표는 뾰족하게 */
.arrow-seg.final::after{
  right:-14px;
  border-left-color:inherit;
}

/* ══ 선지자 카드 ══ */
.prophet-card{
  position:absolute;
  border-radius:20px;
  padding:0 10px;
  font-size:15px;
  font-weight:700;
  color:#fff;
  display:flex;
  align-items:center;
  gap:5px;
  overflow:hidden;
  white-space:nowrap;
  box-shadow:0 2px 8px rgba(0,0,0,0.3);
  cursor:default;
  transition:transform 0.12s, box-shadow 0.12s;
}
.prophet-card:hover{
  transform:translateY(-2px);
  box-shadow:0 5px 14px rgba(0,0,0,0.4);
  z-index:10 !important;
}
.prophet-card .pname{
  font-family:'Noto Serif KR',serif;
  font-size:17.2px;
  font-weight:900;
}
.prophet-card .pbook{
  font-size:12.8px;
  opacity:0.85;
}
/* 좁을 때 책이름 숨김 */
.prophet-card.narrow .pbook{ display:none; }
.prophet-card.narrow .pname{ font-size:15px; }

/* ══ 섹션 타이틀 ══ */
.section-title{
  font-family:'Noto Serif KR',serif;
  font-size:22.5px;
  font-weight:900;
  padding:6px 12px 6px 84px;  /* 왼쪽 패딩으로 lane-label 영역 확보 */
  color:#fff;
  letter-spacing:2px;
  border-radius:3px 3px 0 0;
  margin-top:10px;
  margin-bottom:0;
}

/* ══ 선지자 섹션 배경 ══ */
.prophet-section{
  border:2px solid #7c50c0;
  border-radius:4px;
  overflow:visible;
  margin-top:10px;
  margin-left:0;   /* lane-label(72px)이 내부에 포함됨 */
}
.prophet-section-body{
  background:#faf5ff;
  position:relative;
}

/* 선지자 레인 */
.prophet-lane{
  position:relative;
  height:46px;
  border-bottom:1px solid #ddd0f0;
}
.prophet-lane:last-child{ border-bottom:none; }
.lane-label{
  position:absolute;
  left:0;top:0;bottom:0;
  width:72px;
  background:rgba(255,255,255,0.9);
  border-right:2px solid #9060c0;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:12.8px;
  font-weight:700;
  color:#5c2d91;
  writing-mode:vertical-rl;
  letter-spacing:1px;
  z-index:5;
}

/* ══ 범례 ══ */
.legend{
  margin-top:12px;
  display:flex;
  flex-wrap:wrap;
  gap:10px;
  padding:8px 14px;
  background:var(--parch2);
  border:1px solid var(--gold);
  border-radius:4px;
  font-size:14.2px;
}
.li{ display:flex;align-items:center;gap:5px; }
.ld{ width:14px;height:14px;border-radius:3px; }
.ld.round{ border-radius:8px; }

/* 모바일 최적화 */
@media (max-width: 600px) {
  body { font-size: 8px; }
  #tl-wrap { height: 50vh; overflow-x: auto; overflow-y: hidden; }
  #map-wrap { height: 50vh; overflow: auto; }
  .toolbar { flex-wrap: wrap; gap: 4px; padding: 4px 6px; }
  .toolbar button { font-size: 9px; padding: 3px 6px; }
  h1, .main-title { font-size: 13px !important; }
}
</style>
</head>
<body>
<!-- 상단 60%: 연대기 -->
<div id="tl-wrap">
  <div class="page" id="tl-page"></div>
</div>

<!-- 하단 40%: 탭 패널 -->
<div id="bottom-panel">
  <div id="tab-bar">
    <div id="selected-name">인물을 선택하세요</div>
    <button class="tab-btn active" onclick="switchTab('person')">👤 인물 정보</button>
    <button class="tab-btn" onclick="switchTab('map')">🗺️ 당시 지도</button>
  </div>
  <div id="tab-content">
    <!-- 인물 탭 -->
    <div id="tab-person">
      <div id="bottom-empty">연대기에서 인물을 클릭하면 정보가 표시됩니다</div>
    </div>
    <!-- 지도 탭 -->
    <div id="tab-map">
      <div id="map-container">
        <div id="map-title"></div>
        <div id="map-svg-wrap"></div>
      </div>
    </div>
  </div>
</div>
<h1>구약성경 왕 · 선지자 연대 타임라인</h1>

<!--
  기준: BC2000 ~ BC400
  총 1600년, 1년 = 4.2px
  left 기준: (2000 - |BC연도|) × 4.2
  ex) BC931 → (2000-931)×4.2 = 1069×4.2 = 4489.8px
-->

<script>
// ── 헬퍼 ──────────────────────────────
const PX = 4.2;
const BASE = 2200;     // BC 2200 = left 0 (아브라함 BC2166 수용)

function x(bc){ return (BASE - bc) * PX; }   // left px
function w(start, end){ return Math.max((start - end) * PX, 22); } // width px (start > end, bc기준)

// ── 데이터 ────────────────────────────

// 시대 배너
const eras = [
  { label:'창조·원역사·족장', start:2000, end:1526, bg:'#2d4a8a' },
  { label:'출애굽·광야', start:1526, end:1406, bg:'#1e5a8a' },
  { label:'사사시대', start:1406, end:1050, bg:'#1a4a7a' },
  { label:'통일왕국 (사울·다윗·솔로몬)', start:1050, end:931, bg:'#1e3a6e' },
  // 분열 후는 두 행으로 표현
];

// 분열 전 지도자
const preLeaders = [
  // 족장 — 겹치는 인물은 위에 표시될 인물을 나중에 배치
  { name:'야곱',     start:2006, end:1859, bc:'2006~1859', type:'pre', note:'good' },  // 먼저 (아래)
  { name:'아브라함', start:2166, end:1991, bc:'2166~1991', type:'pre', note:'good' },  // 나중 (위)
  { name:'이삭',     start:2066, end:1886, bc:'2066~1886', type:'pre', note:'good' },  // 맨 위
  { name:'요셉',     start:1915, end:1805, bc:'1915~1805', type:'pre', note:'good' },
  // 공백 구간: BC1805~BC1526 (요셉 사망 후 모세 출생 전)
  // 출애굽
  { name:'모세',     start:1526, end:1406, bc:'1526~1406', type:'pre', note:'good' },
  { name:'여호수아', start:1406, end:1380, bc:'1406~1380', type:'pre', note:'good' },
  // 사사
  { name:'옷니엘', start:1374, end:1334, bc:'~1334', type:'pre', note:'good' },
  { name:'에훗', start:1316, end:1236, bc:'~1236', type:'pre', note:'good' },
  { name:'드보라', start:1216, end:1176, bc:'~1176', type:'pre', note:'good' },
  { name:'기드온', start:1169, end:1129, bc:'~1129', type:'pre', note:'good' },
  { name:'아비멜렉', start:1129, end:1126, bc:'3년', type:'pre', note:'evil' },
  { name:'입다', start:1100, end:1094, bc:'6년', type:'pre', note:'good' },
  { name:'삼손', start:1075, end:1055, bc:'20년', type:'pre', note:'good' },
  { name:'엘리', start:1107, end:1067, bc:'40년', type:'pre', note:'good' },
  { name:'사무엘', start:1067, end:1010, bc:'~1010', type:'pre', note:'good' },
  // 통일왕국
  { name:'사   울', start:1050, end:1010, bc:'1050~1010', type:'unified', note:'mixed' },
  { name:'다   윗', start:1010, end:970,  bc:'1010~970', type:'unified', note:'good' },
  { name:'솔로몬', start:970,  end:931,  bc:'970~931',  type:'unified', note:'good' },
];

// 북이스라엘 왕 (BC931~722)
const northKings = [
  { name:'여로보암1', start:931, end:910, bc:'931~910', note:'evil' },
  { name:'나  답', start:910, end:909, bc:'910~909', note:'evil' },
  { name:'바아사', start:909, end:886, bc:'909~886', note:'evil' },
  { name:'엘  라', start:886, end:885, bc:'886~885', note:'evil' },
  { name:'오므리', start:885, end:874, bc:'885~874', note:'evil' },
  { name:'아  합', start:874, end:853, bc:'874~853', note:'evil' },
  { name:'아하시야', start:853, end:852, bc:'853~852', note:'evil' },
  { name:'요  람', start:852, end:841, bc:'852~841', note:'evil' },
  { name:'예  후', start:841, end:814, bc:'841~814', note:'evil' },
  { name:'여호아하스', start:814, end:798, bc:'814~798', note:'evil' },
  { name:'요아스', start:798, end:782, bc:'798~782', note:'evil' },
  { name:'여로보암2', start:793, end:753, bc:'793~753', note:'evil' },
  { name:'스가랴', start:753, end:752, bc:'6개월', note:'evil' },
  { name:'살  룸', start:752, end:752, bc:'1개월', note:'evil' },
  { name:'므나헴', start:752, end:742, bc:'752~742', note:'evil' },
  { name:'브가히야', start:742, end:740, bc:'742~740', note:'evil' },
  { name:'베  가', start:752, end:732, bc:'752~732', note:'evil' },
  { name:'호세아왕', start:732, end:722, bc:'732~722', note:'evil' },
];

// 남유다 왕 (BC931~586)

// ── 왕/지도자 행 빌더 ──
function buildKingRow(label, bgLabel, kings, bgCell, colorFn){
  const wrap = document.createElement('div');
  wrap.className = 'row-wrap';
  wrap.style.minHeight = '50px';

  // 라벨
  const lbl = document.createElement('div');
  lbl.className = 'row-label';
  lbl.style.background = bgLabel;
  lbl.textContent = label;
  wrap.appendChild(lbl);

  // body — margin-left 없이 flex:1 (row-label이 72px 차지)
  const body = document.createElement('div');
  body.style.cssText = `flex:1;position:relative;background:${bgCell};border:1px solid #c8a040;height:100%;overflow:hidden;`;

  kings.forEach(k => {
    const seg = document.createElement('div');
    seg.className = 'king-seg ' + (k.note||'');
    const left = x(k.start||k.startBc||2000);
    const width = w(k.start||k.startBc||2000, k.end||k.endBc||2000);
    seg.style.cssText = `left:${left}px;width:${width}px;background:${colorFn(k)};`;
    seg.innerHTML = `<span class="kname">${k.name}</span><span class="kyear">${k.bc}</span>`;
    seg.title = `${k.name} (BC${k.bc})`;
    seg.addEventListener('click', () => selectPerson(k.name, seg));
    body.appendChild(seg);
  });

  wrap.appendChild(body);
  return wrap;
}

function preColor(k){
  if(k.type==='exile')  return '#3a3a60';
  if(k.type==='return') return '#1a5c2a';
  if(k.type==='unified'){
    if(k.note==='good') return '#1e3a6e';
    return '#2a3a7a';
  }
  if(k.note==='good') return '#2d4a8a';
  if(k.note==='evil') return '#5a2a2a';
  return '#3d5a9a';
}

function northColor(k){
  // 모두 악
  const tones = ['#0a5060','#0a4858','#0a4050','#083848','#0a4a58'];
  return tones[Math.floor(Math.random()*tones.length)];
}

function southColor(k){
  if(k.note==='good') return '#5a1010';
  return '#8b1a1a';
}

function buildProphetSection(){
  const sec = document.createElement('div');
  sec.className = 'prophet-section';

  // 제목 라인 제거됨

  const numLanes = LANE_LABELS.length;
  const body = document.createElement('div');
  body.className = 'prophet-section-body';
  body.style.cssText = 'flex:1;min-height:0;position:relative;background:#faf5ff;overflow:hidden;';

  // 배경 세로 구분선 (시대별)
  const dividers = [
    { bc:1526, label:'출애굽' },
    { bc:1406, label:'사사' },
    { bc:1050, label:'통일왕국' },
    { bc:931,  label:'분열', color:'#ff4020' },
    { bc:722,  label:'북멸망', color:'#aa2020' },
    { bc:586,  label:'남멸망', color:'#aa2020' },
    { bc:538,  label:'귀환' },
  ];

  dividers.forEach(d => {
    const line = document.createElement('div');
    const lx = x(d.bc) + 72;
    line.style.cssText = `position:absolute;left:${lx}px;top:0;bottom:0;width:${d.color?'2':'1'}px;background:${d.color||'rgba(0,0,0,0.12)'};z-index:1;pointer-events:none;`;
    body.appendChild(line);

    const lbl = document.createElement('div');
    lbl.style.cssText = `position:absolute;left:${lx+3}px;top:2px;font-size:7.5px;color:${d.color||'#888'};font-weight:700;z-index:2;`;
    lbl.textContent = `BC${d.bc} ${d.label}`;
    body.appendChild(lbl);
  });

  // 레인별 배경
  LANE_LABELS.forEach((lbl, i) => {
    const lane = document.createElement('div');
    lane.className = 'prophet-lane';
    lane.style.background = i % 2 === 0 ? '#faf5ff' : '#f2ecff';

    const laneLbl = document.createElement('div');
    laneLbl.className = 'lane-label';
    laneLbl.style.background = LANE_COLORS[i] + '22';
    laneLbl.style.borderRightColor = LANE_COLORS[i];
    laneLbl.style.color = LANE_COLORS[i];
    laneLbl.textContent = lbl;
    lane.appendChild(laneLbl);
    body.appendChild(lane);
  });

  // 선지자 카드
  prophets.forEach(p => {
    const card = document.createElement('div');
    card.className = 'prophet-card';
    const left = x(p.start) + 72;   // lane-label(72px) 이후부터
    const width = w(p.start, p.end);
    const laneTop = p.lane * 52;
    const narrow = width < 100;
    if(narrow) card.classList.add('narrow');

    card.style.cssText = `left:${left}px;width:${Math.max(width,80)}px;top:${laneTop+9}px;height:34px;background:${p.color};z-index:3;`;
    card.innerHTML = `<span class="pname">${p.name}</span>${!narrow?`<span class="pbook">${p.book}</span>`:''}`;
    card.title = `${p.name} — ${p.book} (BC${p.start}~${p.end})`;
    card.style.cursor = 'pointer';
    card.addEventListener('click', () => selectPerson(p.name, card));
    body.appendChild(card);
  });

  sec.appendChild(body);
  return sec;
}

function switchTab(tab) {
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
  event.target.classList.add('active');
  document.getElementById('tab-person').style.display = tab === 'person' ? 'flex' : 'none';
  document.getElementById('tab-map').style.display    = tab === 'map'    ? 'block' : 'none';
}

  '여호수아':{ period:'BC1406~1380', type:'지도자', deeds:'모세의 후계자. 요단강 건넘. 여리고 성 함락. 가나안 정복. 12지파 땅 분배.', verses:'수 1~24장 / "오직 나와 내 집은 여호와를 섬기겠노라"(수24:15)', mapEra:'canaan' },
  // 사사
  '사사시대':{ period:'BC1380~1050', type:'시대', deeds:'옷니엘·에훗·드보라·기드온·입다·삼손 등 13명의 사사. 반복적 타락-징벌-회개-구원 패턴.', verses:'삿 1~21장, 룻 1~4장', mapEra:'canaan' },
  '옷니엘':{ period:'BC1374~1334', type:'사사(1대)', deeds:'이스라엘 최초의 사사. 갈렙의 조카. 구산 리사다임 왕의 압제에서 이스라엘을 해방. 40년 평화.', verses:'삿 3:7-11', mapEra:'canaan' },
  '에훗':{ period:'BC~1236', type:'사사(2대)', deeds:'베냐민 지파. 왼손잡이. 모압 왕 에글론을 단검으로 처치. 80년 평화.', verses:'삿 3:12-30', mapEra:'canaan' },
  '드보라':{ period:'BC1216~1176', type:'사사·여선지자', deeds:'이스라엘 유일한 여성 사사. 바락 장군과 함께 가나안 왕 야빈·시스라 격멸. 드보라의 노래.', verses:'삿 4~5장', mapEra:'canaan' },
  '기드온':{ period:'BC1169~1129', type:'사사(6대)', deeds:'300명의 용사로 미디안 대군 격파. 양털 시험. 아비에셀 사람. 이스라엘이 왕 삼으려 했으나 거절.', verses:'삿 6~8장', mapEra:'canaan' },
  '아비멜렉':{ period:'BC1129~1126', type:'사사(7대)', deeds:'기드온의 아들. 형제 70명을 살해하고 왕이 됨. 3년 통치 후 여인이 던진 맷돌에 맞아 죽음.', verses:'삿 9장', mapEra:'canaan' },
  '입다':{ period:'BC1100~1094', type:'사사(11대)', deeds:'길르앗의 기생 아들. 암몬 자손 격퇴. 경솔한 서원으로 딸을 잃음. 길르앗 지파와 에브라임 내전.', verses:'삿 11~12장', mapEra:'canaan' },
  '삼손':{ period:'BC1075~1055', type:'사사(13대)', deeds:'단 지파. 나실인. 블레셋과 20년 싸움. 들릴라에게 비밀 누설 후 눈 뽑힘. 다곤 신전 기둥 무너뜨려 최후.', verses:'삿 13~16장', mapEra:'canaan' },
  '엘리':{ period:'BC1107~1067', type:'제사장·사사', deeds:'실로 성전 제사장. 사무엘을 양육. 아들 홉니·비느하스의 타락 방치. 블레셋에게 언약궤 빼앗긴 날 충격으로 사망.', verses:'삼상 1~4장', mapEra:'canaan' },
  '사무엘':{ period:'BC1067~1010', type:'마지막 사사·선지자', deeds:'한나의 기도로 태어남. 실로 성전에서 하나님의 음성 들음. 사울·다윗에게 기름 부음. 전국 순회 재판.', verses:'삼상 1~16장', mapEra:'canaan' },
  // 통일왕국
  '사   울':{ period:'BC1050~1010', type:'이스라엘 1대 왕', deeds:'이스라엘 첫 번째 왕. 초기 겸손했으나 불법 제사(삼상13장)·아말렉 불완전 진멸(삼상15장). 다윗 살해 시도. 길보아 전투 전사.', verses:'삼상 9~31장', mapEra:'united' },
  '다   윗':{ period:'BC1010~970', type:'이스라엘 2대 왕', deeds:'하나님의 마음에 합한 자. 골리앗 격파. 예루살렘 수도 확정. 시편 다수 저자. 다윗 언약 체결. 밧세바 사건 회개.', verses:'삼상16~삼하24장 / "내 마음에 합한 사람"(행13:22)', mapEra:'united' },
  '솔로몬':{ period:'BC970~931', type:'이스라엘 3대 왕', deeds:'하나님께 지혜 구함. 예루살렘 성전 건축(BC967~960). 잠언·전도서·아가 저자. 스바 여왕 방문. 말년 우상숭배.', verses:'왕상 1~11장', mapEra:'united' },
  // 북이스라엘 왕
  '여로보암1':{ period:'BC931~910', type:'북이스라엘 1대 왕', deeds:'솔로몬의 신하. 왕국 분열 후 북왕국 초대 왕. 벧엘과 단에 금송아지 세워 우상숭배 제도화. 이후 모든 북왕의 죄의 원형.', verses:'왕상 11~14장', mapEra:'divided' },
  '나  답':{ period:'BC910~909', type:'북이스라엘 2대 왕', deeds:'여로보암의 아들. 아버지의 죄 반복. 블레셋과 전쟁 중 바아사에게 암살.', verses:'왕상 15:25-32', mapEra:'divided' },
  '바아사':{ period:'BC909~886', type:'북이스라엘 3대 왕', deeds:'나답을 암살하고 왕이 됨. 유다 왕 아사와 지속 전쟁. 우상숭배 계속.', verses:'왕상 15:33~16:7', mapEra:'divided' },
  '엘  라':{ period:'BC886~885', type:'북이스라엘 4대 왕', deeds:'바아사의 아들. 술에 취해 신하 시므리에게 암살.', verses:'왕상 16:8-14', mapEra:'divided' },
  '오므리':{ period:'BC885~874', type:'북이스라엘 6대 왕', deeds:'군사령관 출신. 내전 승리 후 왕. 사마리아 건축 수도 삼음. 우상숭배 심화. 아합의 아버지.', verses:'왕상 16:21-28', mapEra:'divided' },
  '아  합':{ period:'BC874~853', type:'북이스라엘 7대 왕', deeds:'이세벨과 결혼. 바알 신전 건축. 나봇의 포도원 강탈. 엘리야와 갈멜산 대결. 아람 전쟁 전사.', verses:'왕상 16:29~22:40 / "여호와 보시기에 악을 행하되 더욱 심히"(왕상16:30)', mapEra:'divided' },
  '아하시야':{ period:'BC853~852', type:'북이스라엘 8대 왕', deeds:'아합의 아들. 바알세붑에게 문의. 엘리야의 심판 선언. 낙상 후 병사.', verses:'왕상22:51~왕하1장', mapEra:'divided' },
  '요  람':{ period:'BC852~841', type:'북이스라엘 9대 왕', deeds:'아합의 아들. 바알 신상 제거했으나 여로보암의 죄는 유지. 예후에게 피살.', verses:'왕하 3~9장', mapEra:'divided' },
  '예  후':{ period:'BC841~814', type:'북이스라엘 10대 왕', deeds:'엘리사의 지시로 기름 부음. 아합 가문 전멸. 이세벨 처단. 바알 선지자 처형. 금송아지는 유지.', verses:'왕하 9~10장', mapEra:'divided' },
  '여호아하스':{ period:'BC814~798', type:'북이스라엘 11대 왕', deeds:'예후의 아들. 아람 하사엘에게 심한 압박. 주님께 간구하자 구원자 주심.', verses:'왕하 13:1-9', mapEra:'divided' },
  '요아스':{ period:'BC798~782', type:'북이스라엘 12대 왕', deeds:'엘리사 임종 방문. 아람과 전쟁 세 번 승리. 유다 왕 아마샤와 전쟁 승리.', verses:'왕하 13:10~14:16', mapEra:'divided' },
  '여로보암2':{ period:'BC793~753', type:'북이스라엘 13대 왕', deeds:'최장기 재위(41년). 영토 최대 회복. 경제 번영이나 극심한 빈부격차. 아모스·호세아·요나 활동 시대.', verses:'왕하 14:23-29', mapEra:'divided' },
  '스가랴':{ period:'BC753~752', type:'북이스라엘 14대 왕', deeds:'여로보암2세 아들. 6개월 만에 살룸에게 암살. 예후 왕조의 마지막.', verses:'왕하 15:8-12', mapEra:'divided' },
  '살  룸':{ period:'BC752 (1개월)', type:'북이스라엘 15대 왕', deeds:'스가랴 암살 후 왕. 한 달 만에 므나헴에게 피살.', verses:'왕하 15:13-15', mapEra:'divided' },
  '므나헴':{ period:'BC752~742', type:'북이스라엘 16대 왕', deeds:'앗수르 왕 디글랏빌레셋에게 은 천 달란트 조공. 잔혹한 통치.', verses:'왕하 15:16-22', mapEra:'divided' },
  '브가히야':{ period:'BC742~740', type:'북이스라엘 17대 왕', deeds:'므나헴의 아들. 베가에게 암살.', verses:'왕하 15:23-26', mapEra:'divided' },
  '베  가':{ period:'BC752~732', type:'북이스라엘 18대 왕', deeds:'아람 왕 르신과 동맹해 유다 공격. 앗수르에 갈릴리 점령. 호세아에게 암살.', verses:'왕하 15:27-31', mapEra:'divided' },
  '호세아왕':{ period:'BC732~722', type:'북이스라엘 19대(마지막) 왕', deeds:'앗수르에 조공 바치다 이집트와 내통. BC722 사마리아 함락. 북이스라엘 멸망. 백성 앗수르로 끌려감.', verses:'왕하 17장', mapEra:'divided' },
  // 남유다 왕
  '르호보암':{ period:'BC931~913', type:'남유다 1대 왕', deeds:'솔로몬의 아들. 백성의 세금 경감 청원 무시 → 왕국 분열 초래. 시삭 침입으로 성전 보물 약탈.', verses:'왕상 12~14장', mapEra:'divided' },
  '아비얌':{ period:'BC913~911', type:'남유다 2대 왕', deeds:'르호보암의 아들. 아버지의 죄 반복. 북이스라엘과 전쟁 승리.', verses:'왕상 15:1-8', mapEra:'divided' },
  '아  사':{ period:'BC911~870', type:'남유다 3대 왕(선)', deeds:'선한 왕. 산당·남창 추방. 에티오피아 군대 격파. 어머니 마아가를 태후에서 폐위. 말년에 아람 의존.', verses:'왕상 15:9-24, 대하 14~16장', mapEra:'divided' },
  '여호사밧':{ period:'BC873~848', type:'남유다 4대 왕(선)', deeds:'선한 왕. 레위인으로 율법 교육. 모압-암몬 연합군을 찬양대로 격파. 북이스라엘 아합과 동맹은 실책.', verses:'대하 17~20장', mapEra:'divided' },
  '여호람':{ period:'BC848~841', type:'남유다 5대 왕', deeds:'아합 딸 아달랴와 결혼. 형제들 살해. 엘리야에게 심판 편지. 장질환으로 고통스럽게 사망.', verses:'왕하 8:16-24, 대하 21장', mapEra:'divided' },
  '아하시야':{ period:'BC841 (1년)', type:'남유다 6대 왕', deeds:'여호람의 아들. 어머니 아달랴 영향으로 악을 행함. 예후에게 피살.', verses:'왕하 8:25~9:29', mapEra:'divided' },
  '아달랴':{ period:'BC841~835', type:'남유다 여왕', deeds:'아합과 이세벨의 딸. 아들 사망 후 왕손 학살하고 왕위 찬탈. 바알 숭배 강요. 제사장 여호야다에 의해 처형.', verses:'왕하 11장, 대하 22~23장', mapEra:'divided' },
  '요아스':{ period:'BC835~796', type:'남유다 8대 왕(선)', deeds:'7세 즉위. 여호야다 제사장의 보호로 성전에서 성장. 성전 보수. 여호야다 사망 후 우상숭배. 스가랴 선지자 처형. 암살됨.', verses:'왕하 12장, 대하 24장', mapEra:'divided' },
  '아마샤':{ period:'BC796~767', type:'남유다 9대 왕(선)', deeds:'선한 왕이나 온전치 않음. 에돔 정복 후 에돔 신 섬김. 이스라엘에 도전하다 패배. 라기스로 도주 후 암살.', verses:'왕하 14:1-20, 대하 25장', mapEra:'divided' },
  '웃시야':{ period:'BC792~740', type:'남유다 10대 왕(선)', deeds:'최장기 재위(52년) 선한 왕. 블레셋·아라비아 정복. 군사·농업 강화. 말년에 교만하여 성전에서 직접 분향하다 문둥병 걸림. 이사야 소명 시점.', verses:'왕하 15:1-7, 대하 26장 / 사6:1 "웃시야 왕이 죽던 해에 내가 주를 보았다"', mapEra:'divided' },
  '요  담':{ period:'BC750~732', type:'남유다 11대 왕(선)', deeds:'선한 왕. 성전 윗문 건축. 암몬 정복. 이사야·미가 활동 시대.', verses:'왕하 15:32-38, 대하 27장', mapEra:'divided' },
  '아하스':{ period:'BC735~715', type:'남유다 12대 왕(악)', deeds:'심히 악한 왕. 자녀를 불에 태움. 아람-이스라엘 침공 시 앗수르에 의존(이사야는 하나님께 의탁 권고). 다메섹 제단 모방해 성전에 설치.', verses:'왕하 16장, 대하 28장, 사 7장', mapEra:'divided' },
  '히스기야':{ period:'BC729~686', type:'남유다 13대 왕(선)', deeds:'남유다 최고의 선한 왕. 산당·바알 제단 철거. 앗수르 산헤립의 침공 때 이사야와 함께 기도 → 천사가 18만5천 격멸. 죽을병에서 15년 연장. 히스기야 터널 건설.', verses:'왕하 18~20장, 대하 29~32장 / "다윗의 모든 행위와 같이 정직하게 행하였더라"(왕하18:3)', mapEra:'divided' },
  '므낫세':{ period:'BC697~642', type:'남유다 14대 왕(악)', deeds:'유다 최장기 재위(55년) 악한 왕. 히스기야가 제거한 모든 우상 재설치. 아들 불에 태움. 무고한 피. 앗수르에 포로로 끌려갔다 회개 후 귀환.', verses:'왕하 21:1-18, 대하 33장', mapEra:'divided' },
  '아  몬':{ period:'BC642~640', type:'남유다 15대 왕(악)', deeds:'므낫세의 아들. 아버지의 악을 그대로 행함. 신하들에게 암살.', verses:'왕하 21:19-26, 대하 33:21-25', mapEra:'divided' },
  '요시야':{ period:'BC640~609', type:'남유다 16대 왕(선)', deeds:'남유다 최선한 왕. 8세 즉위. 성전 수리 중 율법책 발견. 대대적 종교개혁. 힌놈 골짜기·산당 파괴. 유월절 성대히 거행. 므깃도에서 이집트 군대에 전사.', verses:'왕하 22~23장 / "마음을 다하며 뜻을 다하며 힘을 다하여...요시야와 같은 왕은 없었더라"(왕하23:25)', mapEra:'divided' },
  '여호아하스':{ period:'BC609 (3개월)', type:'남유다 17대 왕', deeds:'요시야의 아들. 이집트 느고 왕에게 폐위. 이집트로 끌려가 그곳에서 사망.', verses:'왕하 23:30-34', mapEra:'exile' },
  '여호야김':{ period:'BC609~598', type:'남유다 18대 왕(악)', deeds:'이집트가 세운 왕. 예레미야 두루마리 칼로 잘라 불태움. 바벨론 느부갓네살 1차 침공(다니엘 등 1차 포로).', verses:'왕하 23:36~24:7, 렘 22·26·36장', mapEra:'exile' },
  '여호야긴':{ period:'BC598~597 (3개월)', type:'남유다 19대 왕(악)', deeds:'바벨론 느부갓네살 2차 침공. 항복 후 바벨론으로. 에스겔 등 2차 포로. 37년 후 바벨론 왕에게 특별 대우.', verses:'왕하 24:8-17', mapEra:'exile' },

let selectedEl = null;

function selectPerson(name, el) {
  // 이전 선택 해제
  if (selectedEl) selectedEl.classList.remove('selected');
  selectedEl = el;
  el.classList.add('selected');

  // 상단 이름 표시
  document.getElementById('selected-name').textContent = name.trim();

  const key = normName(name);
  const data = Object.entries(INFO).find(([k])=>normName(k)===key)?.[1] || {
    period:'정보 없음', type:'-',
    deeds:'이 인물에 대한 정보를 준비 중입니다.',
    verses:'-', mapEra:'canaan'
  };

  // 인물 탭 내용 갱신
  const personTab = document.getElementById('tab-person');
  personTab.innerHTML = `
    <div id="info-left">
      <div id="info-name">${name.trim()}</div>
      <div id="info-period">${data.period}</div>
      <div id="info-type-badge">${data.type}</div>
    </div>
    <div id="info-right">
      <div id="info-deeds">${data.deeds}</div>
      <div id="info-verses">📖 ${data.verses}</div>
    </div>
  `;
  personTab.style.display = 'flex';

  // 지도 탭 내용 갱신
  document.getElementById('map-title').textContent = `${name.trim()} 시대의 지도`;
  document.getElementById('map-svg-wrap').innerHTML = buildMapSVG(data.mapEra, name.trim());

  // empty 숨김
  const empty = document.getElementById('bottom-empty');
  if (empty) empty.remove();
}

    if (lanes.length > 0 && propBody) {
      const h = propBody.clientHeight;
      const perLane = Math.floor(h / lanes.length);
      lanes.forEach(lane => {
        lane.style.height = perLane + 'px';
      });
      // 선지자 카드 위치도 재조정
      const cards = propBody.querySelectorAll('.prophet-card');
      cards.forEach(card => {
        const lane = parseInt(card.style.top) > 0 ?
          Math.floor(parseInt(card.style.top) / 52) : 0;
        const newTop = lane * perLane + Math.floor(perLane * 0.15);
        const newH = Math.floor(perLane * 0.7);
        card.style.top = newTop + 'px';
        card.style.height = newH + 'px';
        card.style.lineHeight = newH + 'px';
        card.style.borderRadius = (newH / 2) + 'px';
        // 글자 크기도 조정
        const pname = card.querySelector('.pname');
        if (pname) pname.style.fontSize = Math.min(newH * 0.5, 21) + 'px';
        const pbook = card.querySelector('.pbook');
        if (pbook) pbook.style.fontSize = Math.min(newH * 0.35, 15) + 'px';
      });
    }
  });

});
</script>

</div><!-- /tl-page -->
</body>
</html>
